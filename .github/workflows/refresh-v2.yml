name: Refresh and deploy
on:
  schedule:
    - cron: "17 11 * * 1"      # Mondays 11:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["templates/**", "static/**", "scripts/**", "config.py"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Collect data
        if: github.event_name != 'push'
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python scripts/collect.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "maker-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: refresh data $(date -u +%F)"
          git push
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
