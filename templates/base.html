<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cfg.SITE_TITLE }}{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ root }}index.html">⚙ {{ cfg.SITE_TITLE }}</a>
  <nav>
    {% for k, c in topics.items() %}<a href="{{ root }}{{ k }}/index.html">{{ c.icon }} {{ c.label }}</a>{% endfor %}
    <a href="{{ root }}dashboards/index.html">📊 Dashboards</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
<footer>Data refreshed {{ updated }} from the GitHub and Hacker News APIs · built with Python</footer>
</body>
</html>
